<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Архиваторлар - AR</title>

  <!-- Подключение AR библиотек -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #ui-container {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    📱 Камераны суретке бағыттаңыз
  </div>

  <!-- AR Сцена -->
  <a-scene 
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/card.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Привязка к маркеру -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Сама картинка с архиваторами, которая появится на экране и будет прыгать -->
      <a-image 
        src="arhivator.png" 
        position="0 0 0.1" 
        scale="1 0.6 1"
        animation="property: position; to: 0 0.1 0.1; dir: alternate; loop: true; dur: 600">
      </a-image>

    </a-entity>
  </a-scene>

</body>
</html>
