<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Информатика 7 сынып - AR</title>

  <!-- Подключение AR библиотек -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #ui-container {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 999;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 10px 15px;
      border-radius: 8px;
      font-family: sans-serif;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- Подсказка для пользователя на экране -->
  <div id="ui-container">
    Камераны суретке бағыттаңыз (Наведите камеру на рисунок)
  </div>

  <!-- AR Сцена -->
  <a-scene 
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/card.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- 3D Объект, который появится и будет крутиться над картинкой -->
    <a-entity mindar-image-target="targetIndex: 0">
      <!-- Вращающийся куб (можно заменить на любую 3D модель) -->
      <a-box 
        position="0 0 0.2" 
        scale="0.5 0.5 0.5" 
        material="color: #4CC3D9; transparent: true; opacity: 0.9;" 
        animation="property: rotation; to: 0 360 360; loop: true; dur: 4000">
      </a-box>
    </a-entity>
  </a-scene>

</body>
</html>
