<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Архиваторлар - AR</title>

  <!-- Подключение AR библиотек -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin: 0; overflow: hidden; }
    #ui-container {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 14px;
      text-align: center;
    }
  </style>
</head>
<body>

  <div id="ui-container">
    📱 Камераны архиватор суретіне бағыттаңыз
  </div>

  <!-- AR Сцена -->
  <a-scene 
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/card.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- Привязка к картинке -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- 1-я кнопка "Добавить" (прыгает вверх-вниз) -->
      <a-box 
        position="-0.3 0.2 0.05" 
        scale="0.2 0.1 0.02" 
        color="#ff3333"
        animation="property: position; to: -0.3 0.25 0.05; dir: alternate; loop: true; dur: 500">
      </a-box>

      <!-- 2-я кнопка "Просмотр" (прыгает) -->
      <a-box 
        position="0.3 0.2 0.05" 
        scale="0.2 0.1 0.02" 
        color="#33ff33"
        animation="property: position; to: 0.3 0.25 0.05; dir: alternate; loop: true; dur: 600">
      </a-box>

      <!-- 3-я кнопка "Извлечь" (прыгает) -->
      <a-box 
        position="-0.3 0 0.05" 
        scale="0.2 0.1 0.02" 
        color="#3333ff"
        animation="property: position; to: -0.3 0.05 0.05; dir: alternate; loop: true; dur: 550">
      </a-box>

      <!-- 4-я кнопка "Найти" (прыгает) -->
      <a-box 
        position="0.3 0 0.05" 
        scale="0.2 0.1 0.02" 
        color="#ffff33"
        animation="property: position; to: 0.3 0.05 0.05; dir: alternate; loop: true; dur: 650">
      </a-box>

    </a-entity>
  </a-scene>

</body>
</html>
