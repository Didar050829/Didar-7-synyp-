<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Информатика 7 сынып - AR</title>

  <!-- Подключение AR библиотек -->
  <script src="https://aframe.io/releases/1.3.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
    }
    #ui-container {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 999;
      background: rgba(0, 0, 0, 0.7);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-family: sans-serif;
      font-size: 15px;
      text-align: center;
      box-shadow: 0 4px 6px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <!-- Подсказка на экране -->
  <div id="ui-container">
    📱 Камераны кітаптағы суретке бағыттаңыз
  </div>

  <!-- AR Сцена -->
  <a-scene 
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/examples/image-tracking/assets/card-example/card.mind;" 
    color-space="sRGB" 
    renderer="colorManagement: true, physicallyCorrectLights" 
    vr-mode-ui="enabled: false" 
    device-orientation-permission-ui="enabled: false">
    
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- То, что появляется при наведении на картинку -->
    <a-entity mindar-image-target="targetIndex: 0">
      
      <!-- Красивая анимированная рамка или плашка, которая «оживает» и мигает (меняет прозрачность) -->
      <a-plane 
        position="0 0 0.1" 
        rotation="0 0 0" 
        width="1" 
        height="0.6" 
        material="color: #ffffff; shader: flat; transparent: true; opacity: 0.9;"
        animation="property: material.opacity; from: 0.4; to: 1; dir: alternate; loop: true; dur: 800">
      </a-plane>

      <!-- Текст или значок поверх ожившей картинки -->
      <a-text 
        value="Компьютер түрлері" 
        position="-0.35 0.2 0.15" 
        scale="0.5 0.5 0.5" 
        color="#000000">
      </a-text>

    </a-entity>
  </a-scene>

</body>
</html>
